<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaarli and altShaarli</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 250px;
    }
    .icon-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: black;
      font-size: 12px;
      cursor: pointer;
    }
    .icon-button img {
      width: 40px;
      height: 40px;
      margin-bottom: 5px;
    }
    .icon-button:hover {
      color: #0078d4;
    }
    /* Hide the altShaarli button by default */
    #altShaarli-button {
      display: none;
    }
  </style>
</head>
<body>
  <a href="#" class="icon-button" id="settings-button">
    <img src="../../resources/icons/cogwheel.png" alt="Settings">
    <span>Settings</span>
  </a>
  <a href="#" class="icon-button" id="shaarli-button">
    <img src="../../resources/icons/icon-48.png" alt="Share">
    <span>Share</span>
  </a>
  <a href="#" class="icon-button" id="altShaarli-button">
    <img src="../../resources/icons/icon-48_neg.png" alt="altShaarli">
    <span>Alt</span>
  </a>
  <script src="menu.js"></script>
</body>
</html>
