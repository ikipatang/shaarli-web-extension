<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="options.css"/>
  </head>
  <body>
    <div class="main">
      <h2>Shaarli Web Extension</h2>

      <fieldset>
        <legend>General</legend>
        <div class="row">
          <label>
            <input id="showMenu" type="checkbox" name="showMenu" checked>
            <span>Show menu</span>
          </label>
        </div>
        <div class="row">
          <label>
            <input id="pageAction" type="checkbox" name="pageAction">
            <span>Button in address bar</span>
          </label>
        </div>
        <div class="row">
          <label>
            <input id="retrieveDescription" type="checkbox" name="retrieveDescription">
            <span>Automatically retrieve description</span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Popup</legend>
        <div class="row">
          <label>
            <span>Width</span>
            <input id="popupWidth" type="number" min="45" name="popupWidth" placeholder="800">
          </label>
          <label>
            <span>Height</span>
            <input id="popupHeight" type="number" min="45" name="popupHeight" placeholder="900">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Shaarli instances</legend>
        <div class="row">
          <label>
            <span>Shaarli URL</span>
            <input id="url" type="url" name="url" placeholder="https://shaarli.example.com">
          </label>
        </div>
        <div class="row">
          <label>
            <span>Alt. Shaarli URL</span>
            <input id="altUrl" type="url" name="altUrl" placeholder="https://shaarli-alt.example.com">
          </label>
        </div>
      </fieldset>

      <div class="button-row">
        <button id="save-button" type="submit">Save</button>
      </div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
