<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="options.css"/>
  </head>

  <body>
    <div class="main">
      <div class="row">
        <label>
          <span>Show Menu</span>
          <input id="showMenu" type="checkbox" name="showMenu" checked>
        </label>
      </div>
      <div class="row">
        <label>
          <span>Button address bar</span>
          <input id="pageAction" type="checkbox" name="pageAction" checked>
        </label>
      </div>
      <div class="row">
        <label>
          <span>Automatically retrieve description</span>
          <input id="retrieveDescription" type="checkbox" name="retrieveDescription" checked>
        </label>
      </div>
      <div class="row">
        <label>
          <span>Popup dimensions (px)</span>
          <input id="popupWidth" type="number" min="45" name="popupWidth">
          <input id="popupHeight" type="number" min="45" name="popupHeight"> (default : 800 x 900)
        </label>
      </div>
      <hr>
      <div class="row">
        <label>
          <span>Shaarli URL</span>
          <input id="url" type="url" name="url">
        </label>
      </div>
      <div class="row">
        <label>
          <span>Alternative</span>
          <input id="altUrl" type="url" name="altUrl">
        </label>
      </div>
      <div class="button-row">
        <button id="save-button" type="submit">Save preferences</button>
      </div>
    </div>

    <script src="options.js"></script>
  </body>

</html>
